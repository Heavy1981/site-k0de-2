<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard — køde Blog Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1628'/%3E%3Ctext x='3.5' y='22.5' font-family='Space Grotesk,sans-serif' font-weight='800' font-size='16' fill='%23ffffff'%3Ek%3C/text%3E%3Ctext x='12.5' y='22.5' font-family='Space Grotesk,sans-serif' font-weight='800' font-size='16' fill='%234B7BFF'%3E%C3%B8%3C/text%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#4B7BFF;--dark:#020408;--dark-900:#060d14;--dark-800:#0a1628;--text:#f0f4f8;--muted:#8899aa;--green:#22c55e;--red:#ef4444;--yellow:#eab308}
body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}

header{background:rgba(6,13,20,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);padding:0 1.5rem;position:sticky;top:0;z-index:100}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.3rem;text-decoration:none;color:var(--text)}
.logo span{color:var(--blue)}
.logo small{font-size:.65rem;font-weight:500;color:var(--muted);margin-left:.5rem;letter-spacing:1px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.header-actions{display:flex;gap:.75rem;align-items:center}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.25rem;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.875rem;cursor:pointer;transition:all .2s;text-decoration:none;border:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#3a6ae8}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.1)}
.btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.btn-sm{padding:.4rem .9rem;font-size:.78rem;border-radius:8px}
.btn-danger{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-success{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.btn-success:hover{background:rgba(34,197,94,.2)}

main{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.page-title{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:2rem}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
.stat{background:var(--dark-800);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:1.25rem}
.stat-value{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:2rem;color:var(--text)}
.stat-label{font-size:.8rem;color:var(--muted);margin-top:.25rem}

.posts-table{width:100%;border-collapse:collapse}
.posts-table th{text-align:left;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,.06)}
.posts-table td{padding:.9rem 1rem;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.posts-table tr:hover td{background:rgba(255,255,255,.02)}

.post-thumb{width:52px;height:36px;object-fit:cover;border-radius:6px;background:var(--dark-900)}
.post-title-cell{font-weight:600;font-size:.9rem;color:var(--text);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-chip{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:500;text-transform:uppercase;letter-spacing:1.2px;padding:2px 7px;border-radius:6px;background:rgba(75,123,255,.1);color:var(--blue);border:1px solid rgba(75,123,255,.2);white-space:nowrap}

.status-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:6px}
.status-published{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.status-draft{background:rgba(234,179,8,.1);color:var(--yellow);border:1px solid rgba(234,179,8,.2)}

.actions{display:flex;gap:.5rem;align-items:center}
.date-cell{font-size:.8rem;color:var(--muted);white-space:nowrap}

.empty-state{text-align:center;padding:4rem 1rem;color:var(--muted)}
.empty-state h3{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--text);margin-bottom:.5rem}
.loading-row td{text-align:center;padding:3rem;color:var(--muted)}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--dark-800);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.75rem 1.25rem;font-size:.875rem;transform:translateY(100px);opacity:0;transition:all .3s;z-index:999}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(34,197,94,.3);color:var(--green)}
.toast.error{border-color:rgba(239,68,68,.3);color:var(--red)}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">k<span>ø</span>de <small>Admin</small></a>
    <div class="header-actions">
      <a href="/blog" class="btn btn-ghost btn-sm" target="_blank">Ver blog ↗</a>
      <a href="/blog/admin/editor" class="btn btn-primary btn-sm">+ Novo post</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
    </div>
  </div>
</header>

<main>
  <h1 class="page-title">Posts</h1>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-value" id="totalCount">—</div><div class="stat-label">Total de posts</div></div>
    <div class="stat"><div class="stat-value" id="publishedCount">—</div><div class="stat-label">Publicados</div></div>
    <div class="stat"><div class="stat-value" id="draftCount">—</div><div class="stat-label">Rascunhos</div></div>
  </div>

  <table class="posts-table">
    <thead>
      <tr>
        <th style="width:60px"></th>
        <th>Título</th>
        <th>Tag</th>
        <th>Status</th>
        <th>Data</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="postsBody">
      <tr class="loading-row"><td colspan="6">Carregando posts...</td></tr>
    </tbody>
  </table>
</main>

<div class="toast" id="toast"></div>

<script>
const token = sessionStorage.getItem('blog_token')
if (!token) location.href = '/blog/admin'

function logout() {
  sessionStorage.removeItem('blog_token')
  location.href = '/blog/admin'
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = `toast show ${type}`
  setTimeout(() => t.classList.remove('show'), 3000)
}

function formatDate(iso) {
  if (!iso) return '—'
  return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' })
}

async function toggleStatus(id, currentStatus) {
  const newStatus = currentStatus === 'published' ? 'draft' : 'published'
  const res = await fetch(`/api/blog/posts?id=${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ status: newStatus }),
  })
  if (res.ok) { showToast(newStatus === 'published' ? 'Post publicado!' : 'Movido para rascunho'); loadPosts() }
  else showToast('Erro ao atualizar status', 'error')
}

async function deletePost(id, title) {
  if (!confirm(`Deletar "${title}"?\n\nEsta ação não pode ser desfeita.`)) return
  const res = await fetch(`/api/blog/posts?id=${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${token}` },
  })
  if (res.ok) { showToast('Post deletado'); loadPosts() }
  else showToast('Erro ao deletar', 'error')
}

async function loadPosts() {
  try {
    const res = await fetch('/api/blog/posts?all=1', {
      headers: { 'Authorization': `Bearer ${token}` },
    })
    const posts = await res.json()

    if (!Array.isArray(posts)) {
      document.getElementById('postsBody').innerHTML = '<tr class="loading-row"><td colspan="6">Erro ao carregar posts</td></tr>'
      return
    }

    const published = posts.filter(p => p.status === 'published').length
    document.getElementById('totalCount').textContent = posts.length
    document.getElementById('publishedCount').textContent = published
    document.getElementById('draftCount').textContent = posts.length - published

    if (!posts.length) {
      document.getElementById('postsBody').innerHTML = `
        <tr><td colspan="6">
          <div class="empty-state">
            <h3>Nenhum post ainda</h3>
            <p>Clique em "+ Novo post" para criar o primeiro artigo.</p>
          </div>
        </td></tr>`
      return
    }

    document.getElementById('postsBody').innerHTML = posts.map(p => `
      <tr>
        <td>${p.cover_url ? `<img class="post-thumb" src="${p.cover_url}" alt=""/>` : '<div class="post-thumb"></div>'}</td>
        <td><div class="post-title-cell" title="${p.title}">${p.title}</div></td>
        <td><span class="tag-chip">${p.tag || '—'}</span></td>
        <td><span class="status-badge status-${p.status}">${p.status === 'published' ? '✓ Publicado' : '◷ Rascunho'}</span></td>
        <td class="date-cell">${formatDate(p.published_at || p.created_at)}</td>
        <td>
          <div class="actions">
            <button class="btn btn-ghost btn-sm" onclick="location.href='/blog/admin/editor?id=${p.id}'">Editar</button>
            <button class="btn btn-sm ${p.status === 'published' ? 'btn-ghost' : 'btn-success'}" onclick="toggleStatus('${p.id}','${p.status}')">
              ${p.status === 'published' ? 'Despublicar' : 'Publicar'}
            </button>
            <button class="btn btn-danger btn-sm" onclick="deletePost('${p.id}','${p.title.replace(/'/g, "\\'")}')">Deletar</button>
          </div>
        </td>
      </tr>
    `).join('')
  } catch {
    document.getElementById('postsBody').innerHTML = '<tr class="loading-row"><td colspan="6">Erro ao carregar posts</td></tr>'
  }
}

loadPosts()
</script>
</body>
</html>
