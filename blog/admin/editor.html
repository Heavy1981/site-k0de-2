<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Editor — køde Blog Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1628'/%3E%3Ctext x='3.5' y='22.5' font-family='Space Grotesk,sans-serif' font-weight='800' font-size='16' fill='%23ffffff'%3Ek%3C/text%3E%3Ctext x='12.5' y='22.5' font-family='Space Grotesk,sans-serif' font-weight='800' font-size='16' fill='%234B7BFF'%3E%C3%B8%3C/text%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#4B7BFF;--dark:#020408;--dark-900:#060d14;--dark-800:#0a1628;--text:#f0f4f8;--muted:#8899aa;--green:#22c55e}
body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}

header{background:rgba(6,13,20,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);padding:0 1.5rem;position:sticky;top:0;z-index:100}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.3rem;text-decoration:none;color:var(--text)}
.logo span{color:var(--blue)}
.logo small{font-size:.65rem;font-weight:500;color:var(--muted);margin-left:.5rem;letter-spacing:1px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.header-actions{display:flex;gap:.75rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.25rem;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.875rem;cursor:pointer;transition:all .2s;text-decoration:none;border:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#3a6ae8}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.1)}
.btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.btn-draft{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid rgba(255,255,255,.1)}
.btn-draft:hover{background:rgba(255,255,255,.1);color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{max-width:900px;margin:0 auto;padding:2rem 1.5rem 5rem}

.field{margin-bottom:1.5rem}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}
input[type=text],select{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--text);border-radius:10px;padding:.75rem 1rem;font-size:1rem;font-family:'Inter',sans-serif;transition:border-color .2s;-webkit-appearance:none}
input[type=text]:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(75,123,255,.15)}
select option{background:var(--dark-800)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.row{grid-template-columns:1fr}}

/* Cover image */
.cover-zone{border:2px dashed rgba(255,255,255,.1);border-radius:12px;padding:2rem;text-align:center;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden}
.cover-zone:hover{border-color:rgba(75,123,255,.4)}
.cover-zone.has-image{border-color:rgba(75,123,255,.3);padding:0}
.cover-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cover-zone-label{color:var(--muted);font-size:.875rem;pointer-events:none}
.cover-zone-label strong{display:block;color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:700;margin-bottom:.25rem}
.cover-preview{width:100%;max-height:300px;object-fit:cover;border-radius:10px;display:none}
.cover-preview.visible{display:block}
.cover-remove{position:absolute;top:.75rem;right:.75rem;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer;z-index:2;font-family:'Inter',sans-serif}

/* Rich text editor */
.editor-toolbar{display:flex;gap:.25rem;flex-wrap:wrap;padding:.5rem;background:var(--dark-800);border:1px solid rgba(255,255,255,.1);border-bottom:none;border-radius:10px 10px 0 0}
.tb-btn{background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:4px 8px;font-size:.825rem;font-family:'Inter',sans-serif;font-weight:600;transition:all .15s;line-height:1}
.tb-btn:hover{background:rgba(255,255,255,.06);color:var(--text);border-color:rgba(255,255,255,.1)}
.tb-sep{width:1px;background:rgba(255,255,255,.08);margin:0 .25rem}

.editor-content{min-height:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:0 0 10px 10px;padding:1.25rem;font-size:1rem;line-height:1.85;color:#c8d8e8;outline:none;font-family:'Inter',sans-serif}
.editor-content:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(75,123,255,.15)}
.editor-content h2{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.4rem;color:var(--text);margin:1.5rem 0 .75rem}
.editor-content h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.15rem;color:var(--text);margin:1.25rem 0 .5rem}
.editor-content p{margin-bottom:1rem}
.editor-content strong{color:var(--text)}
.editor-content a{color:var(--blue)}
.editor-content blockquote{border-left:3px solid var(--blue);background:rgba(75,123,255,.05);border-radius:0 8px 8px 0;padding:.75rem 1.25rem;margin:1rem 0;color:var(--muted);font-style:italic}
.editor-content ul,.editor-content ol{padding-left:1.5rem;margin-bottom:1rem}
.editor-content code{font-family:'JetBrains Mono',monospace;background:rgba(75,123,255,.08);border:1px solid rgba(75,123,255,.15);border-radius:4px;padding:1px 5px;font-size:.85em;color:#a8c4ff}
.editor-content [data-placeholder]:empty:before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}

.char-count{font-size:.75rem;color:var(--muted);text-align:right;margin-top:.4rem}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--dark-800);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.75rem 1.25rem;font-size:.875rem;transform:translateY(100px);opacity:0;transition:all .3s;z-index:999}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(34,197,94,.3);color:var(--green)}
.toast.error{border-color:rgba(239,68,68,.3);color:#ef4444}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/blog/admin/dashboard" class="logo">k<span>ø</span>de <small>Editor</small></a>
    <div class="header-actions">
      <button class="btn btn-draft" id="draftBtn" onclick="save('draft')">Salvar rascunho</button>
      <button class="btn btn-primary" id="publishBtn" onclick="save('published')">✓ Publicar</button>
    </div>
  </div>
</header>

<main>
  <div class="field">
    <label>Título *</label>
    <input type="text" id="title" placeholder="Digite o título do artigo..." maxlength="150" oninput="updateCharCount()"/>
    <div class="char-count"><span id="titleCount">0</span>/150</div>
  </div>

  <div class="row">
    <div class="field">
      <label>Tag / Categoria</label>
      <select id="tag">
        <option value="IA & Automação">IA & Automação</option>
        <option value="Tecnologia">Tecnologia</option>
        <option value="Negócios">Negócios</option>
        <option value="Tutoriais">Tutoriais</option>
        <option value="Novidades">Novidades</option>
      </select>
    </div>
    <div class="field">
      <label>Resumo (opcional)</label>
      <input type="text" id="excerpt" placeholder="Breve descrição do artigo..." maxlength="200"/>
    </div>
  </div>

  <div class="field">
    <label>Imagem de Capa</label>
    <div class="cover-zone" id="coverZone" onclick="document.getElementById('coverInput').click()">
      <input type="file" id="coverInput" accept="image/*" style="display:none" onchange="handleImage(event)"/>
      <img class="cover-preview" id="coverPreview" src="" alt=""/>
      <div class="cover-zone-label" id="coverLabel">
        <strong>Clique para adicionar imagem</strong>
        JPG, PNG ou WebP — recomendado 1200×630px
      </div>
    </div>
    <input type="hidden" id="coverUrl"/>
  </div>

  <div class="field">
    <label>Conteúdo *</label>
    <div class="editor-toolbar">
      <button class="tb-btn" onclick="fmt('bold')" title="Negrito"><b>B</b></button>
      <button class="tb-btn" onclick="fmt('italic')" title="Itálico"><i>I</i></button>
      <button class="tb-btn" onclick="fmt('underline')" title="Sublinhado"><u>U</u></button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="fmtBlock('h2')" title="Título H2">H2</button>
      <button class="tb-btn" onclick="fmtBlock('h3')" title="Título H3">H3</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="fmt('insertUnorderedList')" title="Lista">• Lista</button>
      <button class="tb-btn" onclick="fmt('insertOrderedList')" title="Lista numerada">1. Lista</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="insertBlockquote()" title="Citação">❝</button>
      <button class="tb-btn" onclick="insertLink()" title="Link">🔗</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="fmt('removeFormat')" title="Limpar formatação">✕ Fmt</button>
    </div>
    <div class="editor-content" id="editor" contenteditable="true"
      data-placeholder="Escreva o conteúdo do artigo aqui..."
      oninput="onEditorInput()">
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
let coverUrlValue = ''
let uploadingImage = false

// Verify server-side cookie before showing content
document.body.style.visibility = 'hidden'
fetch('/api/admin/verify', { credentials: 'same-origin' })
  .then(r => {
    if (!r.ok) { location.href = '/blog/admin'; return }
    document.body.style.visibility = 'visible'
    if (editId) {
      document.querySelector('.header-inner .logo small').textContent = 'Editar'
      loadPost(editId)
    }
  })
  .catch(() => location.href = '/blog/admin')

const params = new URLSearchParams(location.search)
const editId = params.get('id')

async function loadPost(id) {
  try {
    const res = await fetch(`/api/blog/posts?all=1`, { credentials: 'same-origin' })
    const posts = await res.json()
    const post = Array.isArray(posts) ? posts.find(p => p.id === id) : null
    if (!post) { showToast('Post não encontrado', 'error'); return }

    document.getElementById('title').value = post.title || ''
    document.getElementById('tag').value = post.tag || 'IA & Automação'
    document.getElementById('excerpt').value = post.excerpt || ''
    document.getElementById('editor').innerHTML = post.content || ''
    updateCharCount()

    if (post.cover_url) {
      coverUrlValue = post.cover_url
      document.getElementById('coverUrl').value = post.cover_url
      const preview = document.getElementById('coverPreview')
      preview.src = post.cover_url
      preview.classList.add('visible')
      document.getElementById('coverLabel').style.display = 'none'
      document.getElementById('coverZone').classList.add('has-image')
      addRemoveBtn()
    }
  } catch { showToast('Erro ao carregar post', 'error') }
}

function updateCharCount() {
  document.getElementById('titleCount').textContent = document.getElementById('title').value.length
}

function onEditorInput() {
  // ensure placeholder works
}

// Toolbar commands
function fmt(cmd) {
  document.getElementById('editor').focus()
  document.execCommand(cmd, false, null)
}

function fmtBlock(tag) {
  document.getElementById('editor').focus()
  document.execCommand('formatBlock', false, tag)
}

function insertBlockquote() {
  document.getElementById('editor').focus()
  document.execCommand('formatBlock', false, 'blockquote')
}

function insertLink() {
  const url = prompt('URL do link:')
  if (url) {
    document.getElementById('editor').focus()
    document.execCommand('createLink', false, url)
  }
}

// Image handling
function addRemoveBtn() {
  const zone = document.getElementById('coverZone')
  if (zone.querySelector('.cover-remove')) return
  const btn = document.createElement('button')
  btn.className = 'cover-remove'
  btn.textContent = '✕ Remover'
  btn.onclick = (e) => { e.stopPropagation(); removeCover() }
  zone.appendChild(btn)
}

function removeCover() {
  coverUrlValue = ''
  document.getElementById('coverUrl').value = ''
  const preview = document.getElementById('coverPreview')
  preview.src = ''
  preview.classList.remove('visible')
  document.getElementById('coverLabel').style.display = ''
  document.getElementById('coverZone').classList.remove('has-image')
  const btn = document.querySelector('.cover-remove')
  if (btn) btn.remove()
}

async function handleImage(e) {
  const file = e.target.files[0]
  if (!file) return

  if (file.size > 5 * 1024 * 1024) { showToast('Imagem muito grande (máx 5MB)', 'error'); return }

  uploadingImage = true
  showToast('Enviando imagem...', 'success')

  const reader = new FileReader()
  reader.onload = async (ev) => {
    const base64 = ev.target.result.split(',')[1]
    try {
      const res = await fetch('/api/blog/upload', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: file.name, contentType: file.type, base64 }),
      })
      const data = await res.json()
      if (res.ok && data.url) {
        coverUrlValue = data.url
        document.getElementById('coverUrl').value = data.url
        const preview = document.getElementById('coverPreview')
        preview.src = data.url
        preview.classList.add('visible')
        document.getElementById('coverLabel').style.display = 'none'
        document.getElementById('coverZone').classList.add('has-image')
        addRemoveBtn()
        showToast('Imagem enviada!', 'success')
      } else {
        const msg = typeof data.error === 'string' ? data.error : JSON.stringify(data.error || data)
        showToast('Upload falhou: ' + msg.slice(0, 120), 'error')
        console.error('Upload error:', data)
      }
    } catch (err) { showToast('Erro de conexão no upload: ' + err.message, 'error') }
    uploadingImage = false
  }
  reader.readAsDataURL(file)
}

// Save post
async function save(status) {
  const title = document.getElementById('title').value.trim()
  if (!title) { showToast('Digite um título', 'error'); document.getElementById('title').focus(); return }

  const content = document.getElementById('editor').innerHTML
  const tag = document.getElementById('tag').value
  const excerpt = document.getElementById('excerpt').value.trim()
  const cover_url = coverUrlValue || null

  if (uploadingImage) { showToast('Aguarde o upload da imagem', 'error'); return }

  const draftBtn = document.getElementById('draftBtn')
  const publishBtn = document.getElementById('publishBtn')
  draftBtn.disabled = publishBtn.disabled = true

  const payload = { title, content, tag, excerpt, cover_url, status }

  try {
    let res, data
    if (editId) {
      res = await fetch(`/api/blog/posts?id=${editId}`, {
        method: 'PATCH',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      })
    } else {
      res = await fetch('/api/blog/posts', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      })
    }

    data = await res.json()
    if (res.ok) {
      showToast(status === 'published' ? 'Post publicado! ✓' : 'Rascunho salvo', 'success')
      setTimeout(() => location.href = '/blog/admin/dashboard', 1200)
    } else {
      const msg = Array.isArray(data) ? data[0]?.message : data?.error || 'Erro ao salvar'
      showToast(msg, 'error')
      draftBtn.disabled = publishBtn.disabled = false
    }
  } catch (e) {
    showToast('Erro de conexão', 'error')
    draftBtn.disabled = publishBtn.disabled = false
  }
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = `toast show ${type}`
  setTimeout(() => t.classList.remove('show'), 3500)
}

// Keyboard shortcut: Ctrl+S = save draft, Ctrl+Enter = publish
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save('draft') }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); save('published') }
})
</script>
</body>
</html>
