<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Blog køde — IA, Automação e Tecnologia</title>
<meta name="description" content="Dicas de IA, automação de atendimento e presença digital para negócios brasileiros."/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1628'/%3E%3Ctext x='3.5' y='22.5' font-family='Space Grotesk,sans-serif' font-weight='800' font-size='16' fill='%23ffffff'%3Ek%3C/text%3E%3Ctext x='12.5' y='22.5' font-family='Space Grotesk,sans-serif' font-weight='800' font-size='16' fill='%234B7BFF'%3E%C3%B8%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#4B7BFF;--dark:#020408;--dark-900:#060d14;--dark-800:#0a1628;--text:#f0f4f8;--muted:#8899aa}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:5px;background:var(--dark-900)}
::-webkit-scrollbar-thumb{background:rgba(75,123,255,.3);border-radius:3px}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(6,13,20,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);padding:0 1.5rem}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.4rem;text-decoration:none;color:var(--text)}
.nav-logo span{color:var(--blue)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500;transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--text)}

/* HERO */
.hero{padding:5rem 1.5rem 3rem;text-align:center;max-width:700px;margin:0 auto}
.hero-label{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--blue);background:rgba(75,123,255,.1);border:1px solid rgba(75,123,255,.2);border-radius:20px;padding:4px 14px;margin-bottom:1.5rem}
.hero h1{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(2rem,5vw,3rem);line-height:1.1;color:var(--text);margin-bottom:1rem}
.hero p{color:var(--muted);font-size:1.05rem;line-height:1.7}

/* FILTER TAGS */
.filter-bar{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;padding:1rem 1.5rem 2rem}
.filter-btn{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
.filter-btn.active,.filter-btn:hover{border-color:rgba(75,123,255,.4);background:rgba(75,123,255,.1);color:var(--blue)}

/* GRID */
.blog-container{max-width:1200px;margin:0 auto;padding:0 1.5rem 5rem}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
@media(max-width:900px){.blog-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.blog-grid{grid-template-columns:1fr}}

/* CARD */
.post-card{background:var(--dark-800);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:border-color .2s,transform .2s;cursor:pointer}
.post-card:hover{border-color:rgba(75,123,255,.3);transform:translateY(-4px)}
.post-card-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--dark-900)}
.post-card-img-placeholder{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--dark-900),var(--dark-800));display:flex;align-items:center;justify-content:center;font-size:2rem}
.post-card-body{padding:1.25rem;flex:1;display:flex;flex-direction:column;gap:.75rem}
.post-card-tag{font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);background:rgba(75,123,255,.1);border:1px solid rgba(75,123,255,.2);border-radius:8px;padding:2px 8px;width:fit-content}
.post-card-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;color:var(--text);line-height:1.3}
.post-card-excerpt{font-size:.875rem;color:var(--muted);line-height:1.6;flex:1}
.post-card-meta{font-size:.78rem;color:var(--muted);display:flex;gap:1rem;align-items:center;margin-top:auto}

/* EMPTY STATE */
.empty{text-align:center;padding:4rem 1rem;color:var(--muted)}
.empty h3{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;color:var(--text);margin-bottom:.5rem}

/* LOADING */
.skeleton{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.skel-card{background:var(--dark-800);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden}
.skel-img{width:100%;aspect-ratio:16/9;background:var(--dark-900)}
.skel-body{padding:1.25rem;display:flex;flex-direction:column;gap:.75rem}
.skel-line{background:rgba(255,255,255,.06);border-radius:4px;height:12px}

/* FOOTER */
footer{background:var(--dark-900);border-top:1px solid rgba(255,255,255,.05);padding:2rem 1.5rem;text-align:center;color:var(--muted);font-size:.875rem}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--blue)}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div style="display:flex;align-items:center;gap:.75rem">
      <a href="/" class="nav-logo">k<span>ø</span>de</a>
      <a href="/blog/admin" title="Admin" style="color:rgba(136,153,170,.35);font-size:.75rem;text-decoration:none;transition:color .2s;line-height:1" onmouseover="this.style.color='#4B7BFF'" onmouseout="this.style.color='rgba(136,153,170,.35)'">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="/#servicos">Serviços</a></li>
      <li><a href="/#automacoes">Automações</a></li>
      <li><a href="/#precos">Preços</a></li>
      <li><a href="/blog" class="active">Blog</a></li>
      <li><a href="/#contato">Contato</a></li>
    </ul>
  </div>
</nav>

<div class="hero">
  <span class="hero-label">Blog køde</span>
  <h1>IA, Automação e Tecnologia</h1>
  <p>Dicas práticas para negócios que querem crescer com inteligência artificial e automação.</p>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" onclick="filterPosts('all', this)">Todos</button>
  <button class="filter-btn" onclick="filterPosts('IA & Automação', this)">IA & Automação</button>
  <button class="filter-btn" onclick="filterPosts('Tecnologia', this)">Tecnologia</button>
  <button class="filter-btn" onclick="filterPosts('Negócios', this)">Negócios</button>
  <button class="filter-btn" onclick="filterPosts('Tutoriais', this)">Tutoriais</button>
</div>

<div class="blog-container">
  <div class="blog-grid" id="blogGrid">
    <!-- loading skeletons -->
    <div class="skel-card skeleton"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:40%"></div><div class="skel-line" style="width:80%"></div><div class="skel-line" style="width:65%"></div></div></div>
    <div class="skel-card skeleton"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:40%"></div><div class="skel-line" style="width:80%"></div><div class="skel-line" style="width:65%"></div></div></div>
    <div class="skel-card skeleton"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:40%"></div><div class="skel-line" style="width:80%"></div><div class="skel-line" style="width:65%"></div></div></div>
  </div>
</div>

<footer>
  <p>© 2025 <a href="/">køde</a> — IA, Automação e Presença Digital</p>
</footer>

<script>
let allPosts = []

function formatDate(iso) {
  if (!iso) return ''
  return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' })
}

function readingTime(content) {
  if (!content) return '1 min'
  const words = content.replace(/<[^>]+>/g, '').split(/\s+/).length
  return Math.max(1, Math.ceil(words / 200)) + ' min'
}

function renderCards(posts) {
  const grid = document.getElementById('blogGrid')
  if (!posts.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><h3>Nenhum post encontrado</h3><p>Ainda não há artigos nesta categoria.</p></div>'
    return
  }
  grid.innerHTML = posts.map(p => `
    <a class="post-card" href="/blog/post/${p.slug}">
      ${p.cover_url
        ? `<img class="post-card-img" src="${p.cover_url}" alt="${p.title}" loading="lazy"/>`
        : `<div class="post-card-img-placeholder">✦</div>`}
      <div class="post-card-body">
        <span class="post-card-tag">${p.tag || 'Blog'}</span>
        <h2 class="post-card-title">${p.title}</h2>
        ${p.excerpt ? `<p class="post-card-excerpt">${p.excerpt}</p>` : ''}
        <div class="post-card-meta">
          <span>${formatDate(p.published_at)}</span>
          <span>· ${readingTime(p.content)} de leitura</span>
        </div>
      </div>
    </a>
  `).join('')
}

function filterPosts(tag, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  const filtered = tag === 'all' ? allPosts : allPosts.filter(p => p.tag === tag)
  renderCards(filtered)
}

async function loadPosts() {
  try {
    const res = await fetch('/api/blog/posts')
    allPosts = await res.json()
    if (!Array.isArray(allPosts)) allPosts = []
    renderCards(allPosts)
  } catch (e) {
    document.getElementById('blogGrid').innerHTML = '<div class="empty" style="grid-column:1/-1"><h3>Erro ao carregar posts</h3><p>Tente novamente em alguns instantes.</p></div>'
  }
}

loadPosts()
</script>
</body>
</html>
